# Private headless analyzer configuration; does not alter the user's CAVA UI.
[general]
framerate = 20
bars = 16
autosens = 1
lower_cutoff_freq = 50
higher_cutoff_freq = 16000
sleep_timer = 0

[input]
method = pipewire
source = auto
# Follow the default output without keeping an idle audio device awake.
active = 0
virtual = 1

[output]
method = raw
raw_target = /dev/stdout
data_format = binary
bit_format = 8bit
channels = mono
mono_option = average

[smoothing]
noise_reduction = 60
